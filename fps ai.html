<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype FPS - Beta 2 (Patched AI)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; background-color: #87CEEB; }
        
        /* UI Overlays */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 10; }
        .menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 20; pointer-events: auto; }
        
        /* Typography & Colors */
        .menu-title { font-size: 48px; font-weight: bold; margin-bottom: 20px; color: #ff4444; text-shadow: 2px 2px 0 #000; }
        .title-win { color: #44ff44; }
        .menu-text { font-size: 24px; margin-bottom: 30px; text-align: center; }
        
        button { padding: 15px 30px; margin: 10px; font-size: 20px; font-family: 'Courier New', Courier, monospace; font-weight: bold; background-color: #333; color: white; border: 2px solid #fff; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #fff; color: #000; }
        .btn-special { border-color: #ffaa00; color: #ffaa00; }
        .btn-special:hover { background-color: #ffaa00; color: #000; }

        /* HUD Elements */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background-color: white; transform: translate(-50%, -50%); border-radius: 50%; box-shadow: 0 0 2px #000; }
        #bottom-left { position: absolute; bottom: 20px; left: 20px; color: white; text-shadow: 1px 1px 2px black; font-weight: bold; }
        #health-text { font-size: 24px; }
        #health-bar-bg { width: 200px; height: 20px; background-color: rgba(0, 0, 0, 0.5); margin-top: 5px; border: 2px solid #fff; }
        #health-bar { width: 100%; height: 100%; background-color: #28a745; transition: width 0.2s; }
        
        #top-center { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: white; text-shadow: 1px 1px 2px black; font-weight: bold; font-size: 24px; text-align: center; }
        
        #wave-container { margin-top: 10px; color: #ffaa00; font-size: 20px; display: none; }
        
        /* Boss UI */
        #boss-ui { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); width: 400px; display: none; flex-direction: column; align-items: center; }
        #boss-name { color: #ff4444; font-size: 20px; font-weight: bold; text-shadow: 1px 1px 2px black; margin-bottom: 5px; text-transform: uppercase; }
        #boss-bar-bg { width: 100%; height: 20px; background-color: rgba(0,0,0,0.5); border: 2px solid #fff; }
        #boss-bar { width: 100%; height: 100%; background-color: #ff4444; transition: width 0.1s; }

        #weapon-container { position: absolute; bottom: 20px; right: 20px; text-align: right; color: white; text-shadow: 1px 1px 2px black; }
        #weapon-name { font-size: 20px; margin-bottom: 5px; }
        #ammo-count { font-size: 32px; font-weight: bold; }
        
        #kill-feed { position: absolute; top: 20px; right: 20px; color: white; text-shadow: 1px 1px 2px black; text-align: right; font-size: 16px; }
        .kill-msg { margin-bottom: 5px; color: #ff4444; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="start-menu" class="menu-overlay">
        <div class="menu-title">PROTOTYPE FPS</div>
        <div class="menu-text">Select a Map to Deploy</div>
        <div>
            <button id="btn-map1">Warehouse (CQC)</button>
            <button id="btn-map2">Rooftops (Open)</button>
        </div>
        <div style="margin-top: 15px;">
            <button id="btn-map3" class="btn-special">Base Defend (10 Waves)</button>
        </div>
        <div style="margin-top: 30px; font-size: 14px; color: #aaa; text-align: center;">
            WASD = Move | SPACE = Jump | SHIFT = Sprint<br/>
            1-4 = Weapons | Click = Shoot | R = Reload
        </div>
    </div>

    <div id="death-screen" class="menu-overlay" style="display: none;">
        <div class="menu-title">YOU DIED</div>
        <div class="menu-text">Hostiles overwhelmed you.</div>
        <div>
            <button id="btn-respawn">Retry Mission</button>
            <button id="btn-mainmenu">Main Menu</button>
        </div>
    </div>

    <div id="win-screen" class="menu-overlay" style="display: none;">
        <div class="menu-title title-win">MISSION COMPLETE</div>
        <div class="menu-text">All hostiles eliminated.<br>Sector secured.</div>
        <div>
            <button id="btn-win-mainmenu">Return to Base</button>
        </div>
    </div>

    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="top-center">
            Hostiles Remaining: <span id="enemies-remaining">10</span>
            <div id="wave-container">Wave <span id="current-wave">1</span> / 10</div>
        </div>
        
        <div id="boss-ui">
            <div id="boss-name">Juggernaut Boss</div>
            <div id="boss-bar-bg"><div id="boss-bar"></div></div>
        </div>

        <div id="bottom-left">
            <div id="health-text">100 HP</div>
            <div id="health-bar-bg"><div id="health-bar"></div></div>
        </div>
        <div id="weapon-container">
            <div id="weapon-name">Assault Rifle</div>
            <div id="ammo-count">30 / 30</div>
        </div>
        <div id="kill-feed"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- GAME STATE ---
        let camera, scene, renderer, controls;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        
        let isSprinting = false, moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;

        let playerStats = { health: 100 };
        let bots = [];
        let collidableObjects = []; 
        let environmentGroup = new THREE.Group();
        
        let isDead = false;
        let hasWon = false;
        let isPaused = true;
        let pendingAction = null; 
        let currentMapType = 1;

        // Wave & Game Mode Management
        let gameMode = 'elimination';
        let currentWave = 1;
        const MAX_WAVES = 10;
        let enemiesToSpawn = 0;
        let activeEnemies = 0;
        let isWaveTransitioning = false;
        let activeBoss = null;

        const playerBoundingBox = new THREE.Vector3(1.0, 2.5, 1.0);
        const botBoundingBox = new THREE.Vector3(1.2, 3.0, 1.2);
        const bossBoundingBox = new THREE.Vector3(2.0, 4.5, 2.0);

        // --- WEAPONS CONFIG ---
        const weapons = [
            { name: "Pistol", damage: 25, ammo: 15, maxAmmo: 15, fireRate: 300, type: 'pistol', size: [0.04, 0.06, 0.2], offset: [0.15, -0.15, -0.3], auto: false },
            { name: "Assault Rifle", damage: 20, ammo: 30, maxAmmo: 30, fireRate: 100, type: 'rifle', size: [0.06, 0.1, 0.5], offset: [0.2, -0.2, -0.4], auto: true },
            { name: "Shotgun", damage: 60, ammo: 8, maxAmmo: 8, fireRate: 800, type: 'shotgun', size: [0.08, 0.08, 0.4], offset: [0.2, -0.2, -0.4], auto: false },
            { name: "Sniper Rifle", damage: 100, ammo: 5, maxAmmo: 5, fireRate: 1500, type: 'sniper', size: [0.05, 0.08, 0.7], offset: [0.2, -0.2, -0.5], auto: false }
        ];
        let currentWeaponIndex = 1;
        let lastFireTime = 0;
        let isFiring = false;
        let gunMesh;

        // --- DOM ELEMENTS ---
        const uiElements = {
            startMenu: document.getElementById('start-menu'),
            deathScreen: document.getElementById('death-screen'),
            winScreen: document.getElementById('win-screen'),
            uiLayer: document.getElementById('ui-layer'),
            enemyCount: document.getElementById('enemies-remaining'),
            waveContainer: document.getElementById('wave-container'),
            currentWaveText: document.getElementById('current-wave'),
            bossUI: document.getElementById('boss-ui'),
            bossBar: document.getElementById('boss-bar'),
            weaponName: document.getElementById('weapon-name'),
            ammoCount: document.getElementById('ammo-count'),
            healthText: document.getElementById('health-text'),
            healthBar: document.getElementById('health-bar'),
            killFeed: document.getElementById('kill-feed')
        };

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xdceef5);
            scene.fog = new THREE.Fog(0xdceef5, 10, 150);
            scene.add(environmentGroup);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 1.6;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new PointerLockControls(camera, document.body);
            scene.add(controls.getObject());

            setupUIEvents();

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);
            window.addEventListener('resize', onWindowResize);
            
            createWeaponModel();
        }

        function setupUIEvents() {
            function hideAllMenus() {
                uiElements.startMenu.style.display = 'none';
                uiElements.deathScreen.style.display = 'none';
                uiElements.winScreen.style.display = 'none';
                uiElements.uiLayer.style.display = 'none';
            }

            document.getElementById('btn-map1').addEventListener('click', (e) => { e.stopPropagation(); pendingAction = () => { buildEnvironment(1); respawnPlayer(); }; controls.lock(); });
            document.getElementById('btn-map2').addEventListener('click', (e) => { e.stopPropagation(); pendingAction = () => { buildEnvironment(2); respawnPlayer(); }; controls.lock(); });
            document.getElementById('btn-map3').addEventListener('click', (e) => { e.stopPropagation(); pendingAction = () => { buildEnvironment(3); respawnPlayer(); }; controls.lock(); });
            document.getElementById('btn-respawn').addEventListener('click', (e) => { e.stopPropagation(); pendingAction = () => { respawnPlayer(); }; controls.lock(); });

            const returnToMain = (e) => {
                e.stopPropagation();
                hideAllMenus();
                uiElements.startMenu.style.display = 'flex';
                bots.forEach(b => scene.remove(b.group));
                bots = [];
            };
            document.getElementById('btn-mainmenu').addEventListener('click', returnToMain);
            document.getElementById('btn-win-mainmenu').addEventListener('click', returnToMain);

            document.body.addEventListener('click', () => {
                if (isPaused && !isDead && !hasWon && uiElements.startMenu.style.display === 'flex') controls.lock();
            });

            controls.addEventListener('lock', () => {
                isPaused = false;
                hideAllMenus();
                uiElements.uiLayer.style.display = 'block';
                if (pendingAction) { pendingAction(); pendingAction = null; }
            });

            controls.addEventListener('unlock', () => {
                isPaused = true;
                if (!isDead && !hasWon) {
                    hideAllMenus();
                    document.querySelector('.menu-text').innerText = "Game Paused";
                    uiElements.startMenu.style.display = 'flex';
                }
            });
        }

        function respawnPlayer() {
            isDead = false;
            hasWon = false;
            isWaveTransitioning = false;
            playerStats.health = 100;
            activeBoss = null;
            
            if (currentMapType === 3) {
                gameMode = 'defense';
                currentWave = 1;
                enemiesToSpawn = 5;
                uiElements.waveContainer.style.display = 'block';
                uiElements.currentWaveText.innerText = currentWave;
            } else {
                gameMode = 'elimination';
                enemiesToSpawn = 10;
                uiElements.waveContainer.style.display = 'none';
            }
            
            activeEnemies = 0;
            controls.getObject().position.set(0, 1.6, currentMapType === 3 ? 35 : 0);
            velocity.set(0,0,0);
            weapons.forEach(w => w.ammo = w.maxAmmo);
            
            bots.forEach(b => scene.remove(b.group));
            bots = [];
            
            const initialWave = Math.min(5, enemiesToSpawn);
            for(let i=0; i<initialWave; i++) spawnBot();
            
            updateUI();
        }

        function triggerDeath() {
            isDead = true;
            controls.unlock();
            uiElements.uiLayer.style.display = 'none';
            uiElements.startMenu.style.display = 'none';
            uiElements.deathScreen.style.display = 'flex';
        }

        function triggerWin() {
            hasWon = true;
            controls.unlock();
            uiElements.uiLayer.style.display = 'none';
            uiElements.startMenu.style.display = 'none';
            uiElements.winScreen.style.display = 'flex';
        }

        // --- MAP GENERATION ---
        function createGridTexture(baseColor, lineColor) {
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseColor; ctx.fillRect(0,0,512,512);
            ctx.strokeStyle = lineColor; ctx.lineWidth = 4; ctx.strokeRect(0,0,512,512);
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function buildEnvironment(mapId) {
            currentMapType = mapId;
            while(environmentGroup.children.length > 0) { environmentGroup.remove(environmentGroup.children[0]); }
            collidableObjects = [];

            const wallMat = new THREE.MeshStandardMaterial({ map: createGridTexture('#f4f4f4', '#d0d0d0') });
            const crateMat = new THREE.MeshStandardMaterial({ color: 0xcc7722 }); 
            const darkCrateMat = new THREE.MeshStandardMaterial({ color: 0x444444 }); 

            let mapData = [];

            if (mapId === 1 || mapId === 2) {
                const floorTex = createGridTexture('#dddddd', '#bbbbbb'); floorTex.repeat.set(50, 50);
                const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ map: floorTex }));
                floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
                environmentGroup.add(floor); 

                if (mapId === 1) { 
                    scene.background = new THREE.Color(0xb0c4de); scene.fog = new THREE.Fog(0xb0c4de, 10, 150);
                    mapData = [
                        { s: [40, 10, 2], p: [0, 5, -20], m: wallMat }, { s: [40, 10, 2], p: [0, 5, 20], m: wallMat },
                        { s: [2, 10, 40], p: [-20, 5, 0], m: wallMat }, { s: [2, 10, 40], p: [20, 5, 0], m: wallMat },
                        { s: [10, 5, 2], p: [-5, 2.5, -5], m: wallMat }, { s: [2, 5, 10], p: [5, 2.5, 5], m: wallMat },
                        { s: [4, 4, 4], p: [-10, 2, 10], m: crateMat }, { s: [4, 4, 4], p: [-10, 6, 10], m: crateMat },
                        { s: [3, 3, 3], p: [12, 1.5, -12], m: darkCrateMat }, { s: [3, 3, 3], p: [15, 1.5, -12], m: darkCrateMat }
                    ];
                } else { 
                    scene.background = new THREE.Color(0x87ceeb); scene.fog = new THREE.Fog(0x87ceeb, 10, 150);
                    mapData = [
                        { s: [15, 6, 15], p: [-20, 3, -20], m: wallMat }, { s: [12, 8, 12], p: [25, 4, -15], m: wallMat },
                        { s: [20, 4, 10], p: [0, 2, 25], m: wallMat }, { s: [2, 2, 2], p: [-5, 1, -5], m: crateMat },
                        { s: [2, 2, 2], p: [-5, 1, -7], m: crateMat }, { s: [2, 2, 2], p: [5, 1, 0], m: crateMat },
                        { s: [2, 2, 2], p: [15, 1, 10], m: darkCrateMat }, { s: [4, 6, 4], p: [10, 3, -5], m: darkCrateMat } 
                    ];
                }
            } else if (mapId === 3) {
                scene.background = new THREE.Color(0x444455); scene.fog = new THREE.Fog(0x444455, 20, 200);
                
                const water = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ color: 0x113355 }));
                water.rotation.x = -Math.PI / 2; water.position.y = -2; water.receiveShadow = true;
                environmentGroup.add(water); 

                const baseMat = new THREE.MeshStandardMaterial({ map: createGridTexture('#999999', '#777777') });
                const railMat = new THREE.MeshStandardMaterial({ color: 0x333333 });

                mapData = [
                    { s: [60, 2, 30], p: [0, -1, -40], m: baseMat, isFloor: true },
                    { s: [60, 2, 30], p: [0, -1, 40], m: baseMat, isFloor: true },
                    { s: [8, 2, 50], p: [-20, -1, 0], m: baseMat, isFloor: true },
                    { s: [8, 2, 50], p: [0, -1, 0], m: baseMat, isFloor: true },
                    { s: [8, 2, 50], p: [20, -1, 0], m: baseMat, isFloor: true },
                    
                    { s: [4, 4, 4], p: [-10, 2, 30], m: crateMat },
                    { s: [4, 4, 4], p: [10, 2, 30], m: crateMat },
                    { s: [8, 4, 2], p: [0, 2, 26], m: darkCrateMat },
                    
                    { s: [60, 4, 1], p: [0, 2, 55], m: railMat }, 
                    { s: [60, 4, 1], p: [0, 2, -55], m: railMat }, 
                    { s: [1, 4, 30], p: [-30, 2, 40], m: railMat }, 
                    { s: [1, 4, 30], p: [30, 2, 40], m: railMat }, 
                    { s: [1, 4, 30], p: [-30, 2, -40], m: railMat }, 
                    { s: [1, 4, 30], p: [30, 2, -40], m: railMat }, 
                    
                    { s: [12, 4, 1], p: [-10, 2, 25], m: railMat }, 
                    { s: [12, 4, 1], p: [10, 2, 25], m: railMat },
                    { s: [12, 4, 1], p: [-10, 2, -25], m: railMat }, 
                    { s: [12, 4, 1], p: [10, 2, -25], m: railMat },
                    
                    { s: [1, 4, 50], p: [-24, 2, 0], m: railMat }, { s: [1, 4, 50], p: [-16, 2, 0], m: railMat },
                    { s: [1, 4, 50], p: [-4, 2, 0], m: railMat },  { s: [1, 4, 50], p: [4, 2, 0], m: railMat },
                    { s: [1, 4, 50], p: [16, 2, 0], m: railMat },  { s: [1, 4, 50], p: [24, 2, 0], m: railMat }
                ];
            }

            mapData.forEach(data => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(...data.s), data.m);
                mesh.position.set(...data.p); mesh.castShadow = true; mesh.receiveShadow = true;
                environmentGroup.add(mesh); 
                
                if (!data.isFloor) {
                    collidableObjects.push(new THREE.Box3().setFromObject(mesh));
                }
            });
        }

        // --- WEAPONS ---
        function createWeaponTexture(type) {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            if (type === 'rifle') {
                ctx.fillStyle = '#C19A6B'; ctx.fillRect(0,0,256,256);
                ctx.fillStyle = '#A0522D'; for(let i=0; i<20; i++) ctx.fillRect(Math.random()*256, Math.random()*256, 40, 5); 
            } else if (type === 'shotgun') {
                ctx.fillStyle = '#222222'; ctx.fillRect(0,0,256,256);
                ctx.fillStyle = '#111111'; for(let i=0; i<256; i+=10) ctx.fillRect(0, i, 256, 2); 
            } else if (type === 'sniper') {
                ctx.fillStyle = '#4B5320'; ctx.fillRect(0,0,256,256); ctx.fillStyle = '#3E4227';
                for(let i=0; i<30; i++) { ctx.beginPath(); ctx.arc(Math.random()*256, Math.random()*256, Math.random()*30+10, 0, Math.PI*2); ctx.fill(); }
            } else {
                ctx.fillStyle = '#aaaaaa'; ctx.fillRect(0,0,256,256); ctx.fillStyle = '#cccccc'; ctx.fillRect(0, 100, 256, 50); 
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createWeaponModel() {
            if (gunMesh) camera.remove(gunMesh);
            const w = weapons[currentWeaponIndex];
            gunMesh = new THREE.Group();
            const tex = createWeaponTexture(w.type);
            const body = new THREE.Mesh(new THREE.BoxGeometry(...w.size), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.7 }));
            body.castShadow = true; gunMesh.add(body);
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.2), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            barrel.rotation.x = Math.PI / 2; barrel.position.z = - (w.size[2] / 2) - 0.1; barrel.position.y = w.size[1] / 4;
            gunMesh.add(barrel);
            gunMesh.position.set(...w.offset);
            camera.add(gunMesh);
        }

        // --- HUMANOID BOT ---
        function createHumanoidBot(isBoss = false) {
            const botGroup = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: isBoss ? 0x660000 : 0xaa0000 });
            
            const scale = isBoss ? 1.6 : 1.0;

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8*scale, 1.2*scale, 0.4*scale), mat);
            torso.position.y = 1.8*scale; torso.castShadow = true; botGroup.add(torso);
            
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5*scale, 0.5*scale, 0.5*scale), mat);
            head.position.y = 2.65*scale; head.castShadow = true; botGroup.add(head);
            
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.4*scale, 0.15*scale, 0.05*scale), new THREE.MeshStandardMaterial({color: 0x111111, roughness: 0.2}));
            visor.position.set(0, 2.7*scale, 0.26*scale); botGroup.add(visor);
            
            const armG = new THREE.BoxGeometry(0.25*scale, 1.0*scale, 0.25*scale);
            const lArm = new THREE.Mesh(armG, mat); lArm.position.set(-0.55*scale, 1.8*scale, 0); lArm.castShadow = true; botGroup.add(lArm);
            const rArm = new THREE.Mesh(armG, mat); rArm.position.set(0.55*scale, 1.8*scale, 0); rArm.castShadow = true; botGroup.add(rArm);
            
            const legG = new THREE.BoxGeometry(0.3*scale, 1.2*scale, 0.3*scale);
            const lLeg = new THREE.Mesh(legG, mat); lLeg.position.set(-0.25*scale, 0.6*scale, 0); lLeg.castShadow = true; botGroup.add(lLeg);
            const rLeg = new THREE.Mesh(legG, mat); rLeg.position.set(0.25*scale, 0.6*scale, 0); rLeg.castShadow = true; botGroup.add(rLeg);
            
            const hitBox = new THREE.Mesh(new THREE.BoxGeometry(1.2*scale, 3.0*scale, 1.2*scale), new THREE.MeshBasicMaterial({visible: false}));
            hitBox.position.y = 1.5*scale; botGroup.add(hitBox);

            return { group: botGroup, hitBox: hitBox, visuals: [torso, head, lArm, rArm, lLeg, rLeg] };
        }

        // --- INPUT HANDLING ---
        function onKeyDown(event) {
            if(isPaused || isDead || hasWon || !controls.isLocked) return;
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = true; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                case 'ArrowRight': case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump === true) velocity.y += 10; canJump = false; break;
                case 'ShiftLeft': isSprinting = true; break;
                case 'KeyR': weapons[currentWeaponIndex].ammo = weapons[currentWeaponIndex].maxAmmo; updateUI(); break;
                case 'Digit1': switchWeapon(0); break; case 'Digit2': switchWeapon(1); break;
                case 'Digit3': switchWeapon(2); break; case 'Digit4': switchWeapon(3); break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = false; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                case 'ArrowRight': case 'KeyD': moveRight = false; break;
                case 'ShiftLeft': isSprinting = false; break;
            }
        }

        function onMouseDown(e) {
            if (e.button === 0 && controls.isLocked && !isPaused && !isDead && !hasWon) {
                const w = weapons[currentWeaponIndex];
                if (w.auto) isFiring = true; else fireWeapon();
            }
        }
        function onMouseUp(e) { if (e.button === 0) isFiring = false; }
        function switchWeapon(index) { currentWeaponIndex = index; createWeaponModel(); isFiring = false; updateUI(); }

        // --- WAVE LOGIC ---
        function checkWaveState() {
            if (activeEnemies === 0 && enemiesToSpawn === 0 && !isWaveTransitioning) {
                if (gameMode === 'elimination' || (gameMode === 'defense' && currentWave >= MAX_WAVES)) {
                    triggerWin();
                } else if (gameMode === 'defense') {
                    isWaveTransitioning = true;
                    showKillFeed("WAVE CLEARED!");
                    setTimeout(() => {
                        currentWave++;
                        uiElements.currentWaveText.innerText = currentWave;
                        
                        if (currentWave === 5 || currentWave === 10) {
                            enemiesToSpawn = 1; 
                        } else {
                            enemiesToSpawn = 5 + (currentWave * 2);
                        }
                        
                        isWaveTransitioning = false;
                        for(let i=0; i<Math.min(5, enemiesToSpawn); i++) spawnBot();
                        updateUI();
                    }, 3000);
                }
            }
        }

        function fireWeapon() {
            const w = weapons[currentWeaponIndex];
            const now = performance.now();
            if (w.ammo <= 0 || now - lastFireTime < w.fireRate) return;
            w.ammo--; lastFireTime = now; updateUI();

            gunMesh.position.z += 0.08; gunMesh.rotation.x += 0.05;
            setTimeout(() => { if(gunMesh){ gunMesh.position.z -= 0.08; gunMesh.rotation.x -= 0.05; } }, 50);

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            
            const hitBoxes = bots.map(b => b.hitBox);
            const intersects = raycaster.intersectObjects(hitBoxes);
            
            if (intersects.length > 0) {
                const hitBox = intersects[0].object;
                const botIndex = bots.findIndex(b => b.hitBox === hitBox);
                
                if (botIndex > -1) {
                    const bot = bots[botIndex];
                    bot.hp -= w.damage;
                    
                    bot.hasDetectedPlayer = true;
                    bot.lastKnownPos.copy(controls.getObject().position);
                    
                    bot.visuals.forEach(m => m.material.color.setHex(0xffffff)); 
                    setTimeout(() => { if(bot.hp > 0) bot.visuals.forEach(m => m.material.color.setHex(bot.isBoss ? 0x660000 : 0xaa0000)); }, 100);

                    if (bot.hp <= 0) {
                        scene.remove(bot.group);
                        bots.splice(botIndex, 1);
                        activeEnemies--;
                        if(bot.isBoss) activeBoss = null;
                        
                        updateUI();
                        showKillFeed(bot.isBoss ? "BOSS DEFEATED" : "Enemy Eliminated");

                        if (enemiesToSpawn > 0) setTimeout(spawnBot, 2000);
                        checkWaveState();
                    }
                }
            }
        }

        function spawnBot() {
            if(isDead || hasWon || enemiesToSpawn <= 0) return;
            enemiesToSpawn--; activeEnemies++;
            
            let isBoss = (gameMode === 'defense' && (currentWave === 5 || currentWave === 10) && enemiesToSpawn === 0);
            const botData = createHumanoidBot(isBoss);
            
            let safePos = new THREE.Vector3();
            const colY = isBoss ? 2.5 : 1.6;
            const bounds = isBoss ? bossBoundingBox : botBoundingBox;

            if (currentMapType === 3) {
                for(let attempt = 0; attempt < 10; attempt++) {
                    // THE FIX: Spawn perfectly aligned with the 3 bridges (-20, 0, 20) to prevent corner traps
                    const lanes = [-20, 0, 20];
                    const laneX = lanes[Math.floor(Math.random() * lanes.length)];
                    safePos.set(laneX + (Math.random() - 0.5) * 4, 0, -45 + Math.random() * 15);
                    
                    if (!checkCollision(new THREE.Vector3(safePos.x, colY, safePos.z), bounds)) break;
                }
            } else {
                const playerPos = controls.getObject().position;
                for(let attempt = 0; attempt < 10; attempt++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 20 + Math.random() * 20;
                    safePos.set(playerPos.x + Math.cos(angle)*dist, 0, playerPos.z + Math.sin(angle)*dist);
                    if (!checkCollision(new THREE.Vector3(safePos.x, colY, safePos.z), bounds)) break;
                }
            }

            botData.group.position.copy(safePos);
            botData.group.rotation.y = Math.random() * Math.PI * 2;
            scene.add(botData.group);
            
            const botInstance = { 
                ...botData, 
                isBoss: isBoss,
                isMelee: (currentMapType === 3),
                hp: isBoss ? 1000 : 100, 
                maxHp: isBoss ? 1000 : 100,
                lastShot: performance.now(),
                lastKnownPos: botData.group.position.clone(),
                hasDetectedPlayer: false, // ALL bots now wait until spotted or shot!
                chargeCooldown: 0,
                isCharging: false,
                chargeTime: 0,
                chargeDir: new THREE.Vector3()
            };

            if (isBoss) activeBoss = botInstance;
            bots.push(botInstance);
            updateUI();
        }

        function checkCollision(pos, bounds) {
            const testBox = new THREE.Box3().setFromCenterAndSize(pos, bounds);
            for(let staticBox of collidableObjects) {
                if (staticBox.intersectsBox(testBox)) return true;
            }
            return false;
        }

        // --- AI LOGIC ---
        function updateBots(delta) {
            const playerPos = controls.getObject().position;
            const raycaster = new THREE.Raycaster();
            
            bots.forEach(bot => {
                const botEyePos = bot.group.position.clone();
                botEyePos.y += (bot.isBoss ? 4.0 : 2.6);
                const dirToPlayer = new THREE.Vector3().subVectors(playerPos, botEyePos).normalize();
                const distToPlayer = botEyePos.distanceTo(playerPos);
                
                // Common Line of Sight & FOV calculation for ALL bots
                const botForward = new THREE.Vector3();
                bot.group.getWorldDirection(botForward);
                botForward.y = 0; botForward.normalize();
                
                const flatDirToPlayer = new THREE.Vector3(dirToPlayer.x, 0, dirToPlayer.z).normalize();
                const inFOV = botForward.angleTo(flatDirToPlayer) < (Math.PI / 2.5);
                
                let hasLoS = false;
                if (inFOV && distToPlayer < 60) {
                    raycaster.set(botEyePos, dirToPlayer);
                    const envIntersects = raycaster.intersectObjects(environmentGroup.children);
                    if (envIntersects.length === 0 || envIntersects[0].distance > distToPlayer) {
                        hasLoS = true; 
                    }
                }

                const colY = bot.isBoss ? 2.5 : 1.6;
                const bounds = bot.isBoss ? bossBoundingBox : botBoundingBox;

                // State Machine
                if (hasLoS) {
                    bot.hasDetectedPlayer = true;
                    bot.lastKnownPos.copy(playerPos);
                    bot.group.lookAt(playerPos.x, bot.group.position.y, playerPos.z);
                    
                    if (bot.isBoss) {
                        if (bot.chargeCooldown > 0) bot.chargeCooldown -= delta;
                        
                        if (bot.isCharging) {
                            bot.chargeTime -= delta;
                            const chargeSpeed = 6 * delta; // THE FIX: Boss speed nerfed and respects walls
                            bot.group.position.x += bot.chargeDir.x * chargeSpeed;
                            if (checkCollision(new THREE.Vector3(bot.group.position.x, colY, bot.group.position.z), bounds)) bot.group.position.x -= bot.chargeDir.x * chargeSpeed;
                            bot.group.position.z += bot.chargeDir.z * chargeSpeed;
                            if (checkCollision(new THREE.Vector3(bot.group.position.x, colY, bot.group.position.z), bounds)) bot.group.position.z -= bot.chargeDir.z * chargeSpeed;

                            if (distToPlayer < 3.0 && bot.chargeTime > 0) {
                                playerStats.health -= 40; updateUI(); bot.chargeTime = 0; 
                                uiElements.uiLayer.style.backgroundColor = "rgba(255,0,0,0.5)";
                                setTimeout(() => { uiElements.uiLayer.style.backgroundColor = "transparent"; }, 150);
                                if(playerStats.health <= 0 && !isDead) triggerDeath();
                            }
                            if (bot.chargeTime <= 0) bot.isCharging = false;
                        } else if (distToPlayer < 25 && bot.chargeCooldown <= 0) {
                            bot.isCharging = true; bot.chargeTime = 0.8; bot.chargeCooldown = 4.0;
                            bot.chargeDir.copy(dirToPlayer).normalize(); bot.chargeDir.y = 0;
                            bot.visuals.forEach(m => m.material.color.setHex(0xffaa00)); 
                            setTimeout(() => { if(bot.hp>0) bot.visuals.forEach(m=>m.material.color.setHex(0x660000)); }, 800);
                        }
                    }

                    if (!bot.isCharging) {
                        if (bot.isMelee) {
                            if (distToPlayer > 2.5) {
                                const moveDir = new THREE.Vector3(dirToPlayer.x, 0, dirToPlayer.z).normalize();
                                const speed = (bot.isBoss ? 2.5 : 5.0) * delta; // THE FIX: Normal Boss speed nerfed
                                
                                bot.group.position.x += moveDir.x * speed;
                                if (checkCollision(new THREE.Vector3(bot.group.position.x, colY, bot.group.position.z), bounds)) bot.group.position.x -= moveDir.x * speed;
                                bot.group.position.z += moveDir.z * speed;
                                if (checkCollision(new THREE.Vector3(bot.group.position.x, colY, bot.group.position.z), bounds)) bot.group.position.z -= moveDir.z * speed;
                            } else {
                                const now = performance.now();
                                if (now - bot.lastShot > (bot.isBoss ? 1500 : 1000)) {
                                    playerStats.health -= (bot.isBoss ? 30 : 15); updateUI(); bot.lastShot = now;
                                    uiElements.uiLayer.style.backgroundColor = "rgba(255,0,0,0.3)";
                                    setTimeout(() => { uiElements.uiLayer.style.backgroundColor = "transparent"; }, 100);
                                    if(playerStats.health <= 0 && !isDead) triggerDeath();
                                }
                            }
                        } else {
                            // Standard Ranged Bot behavior
                            const now = performance.now();
                            if (now - bot.lastShot > 1200 && distToPlayer < 40) { 
                                playerStats.health -= 15; updateUI(); bot.lastShot = now;
                                uiElements.uiLayer.style.backgroundColor = "rgba(255,0,0,0.3)";
                                setTimeout(() => { uiElements.uiLayer.style.backgroundColor = "transparent"; }, 100);
                                if(playerStats.health <= 0 && !isDead) triggerDeath();
                            }
                        }
                    }

                } else if (bot.hasDetectedPlayer) {
                    // Moving to Last Known Position (applies to both Melee and Ranged)
                    const distToTarget = bot.group.position.distanceTo(bot.lastKnownPos);
                    if (distToTarget > 2) {
                        const moveDir = new THREE.Vector3().subVectors(bot.lastKnownPos, bot.group.position).normalize();
                        moveDir.y = 0; 
                        const speed = (bot.isBoss ? 2.5 : 4.0) * delta;
                        
                        bot.group.position.x += moveDir.x * speed;
                        if (checkCollision(new THREE.Vector3(bot.group.position.x, colY, bot.group.position.z), bounds)) bot.group.position.x -= moveDir.x * speed;
                        bot.group.position.z += moveDir.z * speed;
                        if (checkCollision(new THREE.Vector3(bot.group.position.x, colY, bot.group.position.z), bounds)) bot.group.position.z -= moveDir.z * speed;
                        
                        bot.group.lookAt(bot.group.position.x + moveDir.x, bot.group.position.y, bot.group.position.z + moveDir.z);
                    } else {
                        bot.hasDetectedPlayer = false; 
                    }
                }
            });
        }

        // --- UI UPDATES ---
        function updateUI() {
            const w = weapons[currentWeaponIndex];
            uiElements.weaponName.innerText = w.name;
            uiElements.ammoCount.innerText = `${w.ammo} / ${w.maxAmmo}`;
            uiElements.healthText.innerText = `${playerStats.health} HP`;
            uiElements.healthBar.style.width = `${Math.max(0, playerStats.health)}%`;
            uiElements.healthBar.style.backgroundColor = playerStats.health > 40 ? '#28a745' : '#dc3545';
            uiElements.enemyCount.innerText = activeEnemies + enemiesToSpawn;

            if (activeBoss && activeBoss.hp > 0) {
                uiElements.bossUI.style.display = 'flex';
                uiElements.bossBar.style.width = `${(activeBoss.hp / activeBoss.maxHp) * 100}%`;
            } else {
                uiElements.bossUI.style.display = 'none';
            }
        }

        function showKillFeed(name) {
            const el = document.createElement('div');
            el.className = 'kill-msg'; el.innerText = name;
            uiElements.killFeed.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }

        // --- MAIN LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1); 
            prevTime = time;

            if (controls.isLocked === true && !isDead && !hasWon && !isPaused) {
                if (isFiring) fireWeapon();

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 30.0 * delta; 

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const speedMultiplier = isSprinting ? 80.0 : 40.0; 
                if (moveForward || moveBackward) velocity.z -= direction.z * speedMultiplier * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speedMultiplier * delta;

                const pos = controls.getObject().position;

                controls.moveRight(-velocity.x * delta);
                if (checkCollision(pos, playerBoundingBox)) {
                    controls.moveRight(velocity.x * delta); 
                    velocity.x = 0;
                }

                controls.moveForward(-velocity.z * delta);
                if (checkCollision(pos, playerBoundingBox)) {
                    controls.moveForward(velocity.z * delta); 
                    velocity.z = 0;
                }

                pos.y += (velocity.y * delta);
                if (pos.y < 1.6) { velocity.y = 0; pos.y = 1.6; canJump = true; }

                if (pos.x > 90) pos.x = 90; if (pos.x < -90) pos.x = -90;
                if (pos.z > 90) pos.z = 90; if (pos.z < -90) pos.z = -90;

                updateBots(delta);
            }

            renderer.render(scene, camera);
        }
    </script>
